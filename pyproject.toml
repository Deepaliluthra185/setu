[project]
name = "setu"
version = "1.0.0"
description = "Setu - Multilingual AI Civic Infrastructure Prioritization Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "google-generativeai>=0.8.0",
    "google-genai>=0.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
